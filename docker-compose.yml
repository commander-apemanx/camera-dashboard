# Camera Dashboard — published Docker Compose package
#
# Pulls the pre-built image from GitHub Container Registry (no local build).
#
#   mkdir camera-dashboard && cd camera-dashboard
#   curl -fsSL -o docker-compose.yml \
#     https://raw.githubusercontent.com/commander-apemanx/camera-dashboard/v1.0.2/docker-compose.yml
#   mkdir -p data Data
#   docker compose up -d
#
# Pin a version:  CAMERA_DASHBOARD_TAG=v1.0.2 docker compose up -d
# UI: http://127.0.0.1:5000  or  http://UNRAID-IP:5000
#
# To build the image yourself instead, use: docker-compose.build.yml

name: camera-dashboard

services:
  camera-dashboard:
    image: ghcr.io/commander-apemanx/camera-dashboard:${CAMERA_DASHBOARD_TAG:-latest}
    pull_policy: always
    container_name: camera-dashboard
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    network_mode: host
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      TZ: Europe/Amsterdam
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp|fflags;nobuffer|flags;low_delay|max_delay;500000|stimeout;5000000"
    volumes:
      - ./data:/app/data
      - ./Data:/app/Data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s

# Bridge mode (only if you cannot use host networking):
#   1. Delete the network_mode: host line
#   2. Add:
#        ports:
#          - "5000:5000"
#   3. Recreate: docker compose up -d
