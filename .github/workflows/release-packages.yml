# Publish two packages on each GitHub Release:
#  1) Docker image → ghcr.io/commander-apemanx/camera-dashboard
#  2) Local ./start.sh tarball → release asset
name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach packages to (e.g. v1.0.2)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/commander-apemanx/camera-dashboard

jobs:
  local-package:
    name: Local start.sh package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build local tarball
        id: pack
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          chmod +x scripts/package-local.sh
          ARCHIVE="$(./scripts/package-local.sh "$TAG")"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "${{ steps.pack.outputs.archive }}" --clobber

  docker-package:
    name: Docker / Compose image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set tags
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # normalize: ensure v-prefix for image tag
          case "$TAG" in
            v*) IMG_TAG="$TAG" ;;
            *) IMG_TAG="v$TAG" ;;
          esac
          echo "tag=$IMG_TAG" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE }}:${IMG_TAG},${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Camera Dashboard
            org.opencontainers.image.description=RTSP/ONVIF dashboard with YOLOv8 person detection
            org.opencontainers.image.source=https://github.com/commander-apemanx/camera-dashboard
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=GPL-3.0-only
